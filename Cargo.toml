[package]
name = "rusty-pad"
version = "0.2.0"
edition = "2021"

[lib]
name = "rusty_pad"
crate-type = ["cdylib"]

[features]
default = ["wasm"]
wasm = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen-futures"]
python = ["dep:pyo3"]

[dependencies]
fend-core = "1.5"
chrono = "0.4"
regex = "1"

# --- Python用 ---
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }

# --- WASM用 (非同期ストリーム処理のため) ---
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["File", "Blob", "ReadableStream", "console"], optional = true }
js-sys = { version = "0.3", optional = true }

[profile.release]
lto = true
opt-level = 3