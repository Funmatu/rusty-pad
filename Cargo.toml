[package]
name = "rusty-pad"
version = "0.1.0"
edition = "2021"
authors = ["Efficiency Enthusiast funmatu@gmail.com"]
description = "A lightweight, memory-conscious notepad and calculator powered by Rust/WASM."

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "rusty_pad"
crate-type = ["cdylib"]

[features]
default = ["wasm"]
wasm = ["dep:wasm-bindgen"]
python = ["dep:pyo3"]

[dependencies]
# 数式評価用ライブラリ
fend-core = "1.5"

# Feature: WebAssembly
wasm-bindgen = { version = "0.2", optional = true }

# Feature: Python
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }

[profile.release]
lto = true
opt-level = "z"  # バイナリサイズを最小化 (Webロード時間を短縮)
codegen-units = 1
strip = true